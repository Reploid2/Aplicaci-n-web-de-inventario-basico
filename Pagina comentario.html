<style>
ul 
{
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color: #333;
}
/*Le da estilo al ul.*/

li 
{
  float: left;
}
/*Se encarga de que cada li este hacia la izquierda.*/

li a, .dropbtn 
{
  display: inline-block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
}
/*Le da estilo al dropdown*/

li a:hover, .dropdown:hover .dropbtn 
{
  background-color: gray;
}
/*Cambia el color de los botenes cuando el usuario pasa el mouese por encima de ellos*/

li.dropdown 
{
  display: inline-block;
}
/*Hace que los elementos de dropdown se alinien horizontalmente.*/

/* Contenedor del menú desplegable, oculto por defecto */
.dropdown-content
{
  display: none;
  position: absolute;
  background-color: #333;
  min-width: 160px;
  box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
  z-index: 1;
}
/*Este bloque se encarga de mantener ocultas las opciones del dropdown hasta que el usuario pase el mouse.*/

.dropdown-content a 
{
  color: white;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  text-align: left;
}
/*Le da estilo a las opciones del dropdown.*/

.dropdown-content a:hover 
{
  background-color: gray;
}
/*Bloque encargado de que cada vez que se pase el mouse por una opción cambie a gris.*/

.dropdown:hover .dropdown-content 
{
  display: block;
}
/*Se encarga de desplegar las opciones cuando el usuario pasa el mouse por encima.*/

div.gallery
{
  margin: 5px;
  border: 1px solid #ccc;
  float: left;
  width: 300px;
}
/*Se encarga de darle bordes a las imágenes de haber alguna.*/

div.gallery:hover 
{
  border: 1px solid #777;
}
/*Cambia el borde de la imagen cuando el usuario pasa el mouse por encima.*/

div.gallery img 
{
  width: 100%;
  height: auto;
}
/*Ajusta la imagen dentro del contenedor de galería*/

div.desc 
{
  padding: 15px;
  text-align: center;
}
/*Estilo del texto descriptivo debajo de cada imagen*/

</style>
</head>
