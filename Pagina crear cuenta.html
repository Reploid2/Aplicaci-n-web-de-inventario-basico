<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Aplicación Web para la creación de listas de inventario</title>
    <style>
        body 
		{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #000;
        }
		/*Se encarga de centralisar la información de la pagina y editar el tipo de letra.*/

        .card 
		{
            background: #fff;
            width: 350px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
        }
		/*Se encarga de darle el fromato de la carta donde van el usuario, contraseñá y botones.*/

        h2 
		{
            margin-bottom: 25px;
            font-weight: 600;
        }
		/*Se encarga del espacio que es ocupado.*/

        input 
		{
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #000;
            background: #fff;
            font-size: 15px;
        }
		/*Le da estilo a todos los inputs.*/

        .btn-container 
		{
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
		/*Se encarga de organizar los botones.*/

        button 
		{
            width: 48%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #000;
            background: #000;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s ease;
        }
		/*Le da el estilo que tienen los botones actualmente.*/


        button:hover 
		{
            background: #333;
        }
		/*Se encarga de cambiar el color de los botones cuando le pasas por encima*/
		
    </style>
</head>
<body>


    <div class="card">
        <input id="nom_usuario" type="text" placeholder="Usuario">
		<!-- Campo donde el usuario escribe su nombre. -->
        <input id="contraseña" type="password" placeholder="Contraseña">
		<!-- Campo donde el usuario escribe su contraseña. -->

        <div class="btn-container">
          <button onclick="crearCuenta()">Confirmar</button>
          <button onclick="location.href='Pagina Inicio de sección.html'">Volver</button>
        </div>
		
		
    </div>

<script>
function crearCuenta() 
{
    let usuario = document.getElementById("nom_usuario").value;
    // Se encarga de buscar el nombre de usuario ingresado.
    let clave = document.getElementById("contraseña").value;
	// Se encarga de buscar la contraseña que fue ingresada.
    let listaUsuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
    // Esta linea de codigo esta encargada de buscar y verificar el local storage para verificar 
    // si existen los datos ingresados.
    let existe = listaUsuarios.some(u => u.nom_usuario === usuario);
	// Se encarga de revisar si el nombre de usuario existe.
    if (existe) 
	{
        alert("Ese nombre de usuario ya está registrado");
        return;
    }
	// if que se encarga de ,amdar un mensaje en caso de que el nombre ingressado exista.
    let nuevoUsuario = 
	{
	    id: Date.now(), 
    // Se encarga de crear un id unico para cada usuario y sirve como primary key.		
        nom_usuario: usuario,
        contraseña: clave
    };
	// Esta linea de codigo se encarga de crear el usuario.
    listaUsuarios.push(nuevoUsuario);
	// Se encarga de gusradar el usuario en una lista para que luegos e mandado al local 
	// storage donde se guarda permanentemente.
    localStorage.setItem("usuarios", JSON.stringify(listaUsuarios));
	// Se encarga de enviar la información del usuario al local storage donde se guarda.
    alert("Cuenta creada con éxito");
	// Mensaje que sale cuando la la cuenta sido creada con exito.
    location.href = "Pagina Inicio de sección.html";
	// Linea que te envia a la pagina de incio de sección una vez creas la cuenta con exito.
}
// Funcion encargada de guardar los datos ingresados por el usuario de no existir.
</script>
</body>
</html>
